# Workflow name — appears in the GitHub Actions tab
name: Run Automated Tests

# TRIGGER: when does this workflow run?
on:
  push:
    branches:
      - main          # every push to main
      - 'feature/**'  # every push to any feature/* branch
  pull_request:
    branches:
      - main          # every PR that targets main

# JOBS: what to run
jobs:
  test-menu-service:
    name: Menu Service Tests
    runs-on: ubuntu-latest  # fresh Ubuntu VM, destroyed after job

    steps:

      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js on the runner VM
      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'          # cache node_modules between runs
          cache-dependency-path: services/menu-service/package-lock.json

      # Step 3: Install project dependencies
      - name: Install dependencies
        working-directory: ./services/menu-service
        run: npm install

      # Step 4: Run the test suite
      - name: Run tests
        working-directory: ./services/menu-service
        env:
          NODE_ENV: test    # enables module.exports in server.js
        run: npm test

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: test-menu-service                  # only run if test job passes
    if: github.ref == 'refs/heads/main'  # only deploy from main branch

    steps:
      - name: Deploy CloudEats to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.DEPLOY_KEY }}
          port:     22
          script: |
            cd ~/cloudeats-app

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building updated services ==="
            docker compose build user-service menu-service order-service api-gateway

            echo "=== Deploying with zero downtime ==="
            docker compose up -d --no-deps user-service
            docker compose up -d --no-deps menu-service
            docker compose up -d --no-deps order-service
            docker compose up -d --no-deps api-gateway

            echo "=== Health check ==="
            sleep 10
            curl -f http://localhost:8000/api/menu/health || exit 1

            echo "=== Deployment complete ✅ ==="
            docker compose ps