# CloudEats Application — Infrastructure as Code
# Complete multi-service deployment with Docker Compose


services:

  # ── DATABASES ──────────────────────────────────

  db:
    image: mysql:8.0
    container_name: cloudeats-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret123}
      MYSQL_DATABASE:     ${MYSQL_DATABASE:-cloudeats}
      MYSQL_USER:         ${MYSQL_USER:-cloudeats_user}
      MYSQL_PASSWORD:     ${MYSQL_PASSWORD:-cloudeats_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cloudeats-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: cloudeats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cloudeats-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  3s
      retries:  5

  mongo:
    image: mongo:4.4.18
    container_name: cloudeats-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret123}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudeats-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── MICROSERVICES ──────────────────────────────

  user-service:
    build:
      context: ./services/user-service
    container_name: cloudeats-user-service
    restart: unless-stopped
    environment:
      PORT:           3004
      MYSQL_HOST:     db
      MYSQL_USER:     ${MYSQL_USER:-cloudeats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cloudeats_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudeats}
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      NODE_ENV:       ${NODE_ENV:-production}
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudeats-network

  menu-service:
    build:
      context: ./services/menu-service
    container_name: cloudeats-menu-service
    restart: unless-stopped
    environment:
      PORT:           3002
      MYSQL_HOST:     db
      MYSQL_USER:     ${MYSQL_USER:-cloudeats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cloudeats_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudeats}
      NODE_ENV:       ${NODE_ENV:-production}
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudeats-network

  order-service:
    build:
      context: ./services/order-service
    container_name: cloudeats-order-service
    restart: unless-stopped
    environment:
      PORT:           3003
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      MONGO_HOST:     mongo
      MONGO_PORT:     27017
      MONGO_USER:     ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-secret123}
      MONGO_DB:       ${MONGO_DB:-orders}
      NODE_ENV:       ${NODE_ENV:-production}
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - cloudeats-network

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: cloudeats-api-gateway
    restart: unless-stopped
    environment:
      PORT:              8000
      USER_SERVICE_URL:  http://user-service:3004
      MENU_SERVICE_URL:  http://menu-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      NODE_ENV:          ${NODE_ENV:-production}
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - menu-service
      - order-service
    networks:
      - cloudeats-network

# ── NETWORKS ─────────────────────────────────
networks:
  cloudeats-network:
    driver: bridge
    name:   cloudeats-network

# ── VOLUMES (Data Persistence) ───────────────
volumes:
  mysql-data:
    name: cloudeats-mysql-data
  redis-data:
    name: cloudeats-redis-data
  mongo-data:
    name: cloudeats-mongo-data